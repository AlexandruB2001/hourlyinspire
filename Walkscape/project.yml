# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen && xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: Walkscape
options:
  bundleIdPrefix: com.walkscape
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team here or in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: ""
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  WalkscapeKit:
    path: Packages/WalkscapeKit
targets:
  Walkscape:
    type: application
    platform: iOS
    sources:
      - path: Walkscape
    dependencies:
      - package: WalkscapeKit
        product: WalkscapeDomain
      - package: WalkscapeKit
        product: PixelArt
      - package: WalkscapeKit
        product: WalkscapeBackend
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkscape.app
        INFOPLIST_FILE: Walkscape/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Walkscape/Resources/Walkscape.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
schemes:
  Walkscape:
    build:
      targets:
        Walkscape: all
    run:
      config: Debug
    archive:
      config: Release
