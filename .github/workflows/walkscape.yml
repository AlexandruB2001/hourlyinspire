name: Walkscape

on:
  push:
    paths:
      - "Walkscape/**"
      - ".github/workflows/walkscape.yml"
  workflow_dispatch:

jobs:
  package-tests:
    name: WalkscapeKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        working-directory: Walkscape/Packages/WalkscapeKit
        run: swift test
      - name: Render art previews
        # Lets the art be reviewed without a Mac: download the "art-preview" artifact (PPM images).
        working-directory: Walkscape/Packages/WalkscapeKit
        run: swift run pixel-preview "$GITHUB_WORKSPACE/art-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: art-preview
          path: art-preview
          retention-days: 14

  database-tests:
    name: Supabase schema + RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Run database tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: Walkscape/supabase/tests/run.sh

  ios-build:
    name: iOS app build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        # Match the SDK the TestFlight workflow uses.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Supabase config
        # Optional: without these secrets the app builds in local-only mode.
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        working-directory: Walkscape
        run: |
          if [ -n "$SUPABASE_HOST" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_HOST = %s\nSUPABASE_ANON_KEY = %s\n' "$SUPABASE_HOST" "$SUPABASE_ANON_KEY" > Config/Secrets.xcconfig
            echo "Supabase configured."
          else
            echo "No Supabase secrets; using Config/Base.xcconfig."
          fi
      - name: Generate project
        working-directory: Walkscape
        run: xcodegen generate
      - name: Build
        working-directory: Walkscape
        run: |
          set -o pipefail
          xcodebuild -project Walkscape.xcodeproj -scheme Walkscape \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              # Compiler errors can be far above the summary, so list them first.
              grep -E "error:" build.log | sort -u | head -60
              tail -60 build.log
              exit 1
            }
          tail -40 build.log
          # Our own compiler warnings (not the Google SDKs'), shown as annotations without failing the build.
          warnings=$(grep -E "/Walkscape/(Walkscape|Packages)/.*warning:" build.log | grep -v SourcePackages | sort -u || true)
          echo "App warnings: $(printf '%s' "$warnings" | grep -c . || true)"
          printf '%s\n' "$warnings" | grep . | head -50 | sed 's/^/::warning::/' || true
      - name: Check bundle contents
        working-directory: Walkscape
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Walkscape.app
          test -f "$app/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy missing from the app bundle"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :SupabaseHost" "$app/Info.plist"
