name: Walkscape

on:
  push:
    paths:
      - "Walkscape/**"
      - ".github/workflows/walkscape.yml"
  workflow_dispatch:

jobs:
  package-tests:
    name: WalkscapeKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Walkscape/Packages/WalkscapeKit
        run: swift test

  ios-build:
    name: iOS app build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Walkscape
        run: xcodegen generate
      - name: Build
        working-directory: Walkscape
        run: |
          set -o pipefail
          xcodebuild -project Walkscape.xcodeproj -scheme Walkscape \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -200
